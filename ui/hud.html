<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis voice pill</title>
  <link rel="stylesheet" href="css/overlay.css">
  <style>
    body {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* The capsule itself is drawn on the canvas: its surface moves like water. */
    #water {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Centred and only as wide as it needs: the droplet stretches to hold it. */
    .content {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      transform: translateX(-50%);
      width: max-content;
      max-width: 440px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .orb {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--silt);
      transition: background-color 260ms var(--ease-out);
    }

    .pill[data-state="thinking"] .orb { background: var(--sage); }
    .pill[data-state="asking"] .orb { background: var(--amber-text); }

    .text {
      flex: 1 1 auto;
      min-width: 0;
      font-size: var(--t-body);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip {
      flex: 0 0 auto;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: var(--t-meta);
      font-weight: 700;
      color: var(--silt);
      background: var(--ramp-0);
    }

    .pill[data-state="thinking"] .chip { color: var(--sage); }
    .pill[data-state="asking"] .chip { color: var(--amber-text); background: var(--amber-ground); }
  </style>
</head>
<body>
  <div class="pill" id="pill" data-state="listening">
    <canvas id="water" aria-hidden="true"></canvas>
    <div class="content">
      <span class="orb" id="orb" aria-hidden="true"></span>
      <p class="text" id="text">Listening…</p>
      <span class="chip" id="chip">Listening</span>
    </div>
  </div>

  <script>
    const STATES = {
      RECORDING_STARTED: ["listening", "Listening", () => "Listening…"],
      RECORDING_CLAUDE: ["listening", "Claude", () => "Listening… still talking to Claude (say “Jarvis” to switch back)"],
      STT_PREVIEW: ["thinking", "Heard", (d) => d.text || "Transcribing…"],
      AGENT_THINKING: ["thinking", "Thinking", (d) => d.text || "Working out what to do…"],
      TTS_SPEAKING: ["speaking", "Jarvis", (d) => d.spoken || d.text || ""],
      IDLE: ["idle", "Ready", () => "Hold your shortcut to talk"],
    };

    const pill = document.getElementById("pill");
    let micTarget = 0;   // latest microphone level, 0..1
    let mic = 0;         // smoothed level the surface follows

    // Called from main.py's HUDWindow.update_hud_state(event, {text, spoken}).
    function updateHUDState(event, data) {
      data = data || {};
      if (event === "AUDIO_LEVEL") {
        micTarget = Math.max(0, Math.min(1, parseFloat(data.text) || 0));
        return;
      }
      const entry = STATES[event];
      if (!entry) return;
      const [state, chip, text] = entry;
      const spoken = text(data);
      // A spoken question that needs an answer ("I need your OK first…") gets the amber edge.
      const asking = event === "TTS_SPEAKING" && /need your OK/i.test(spoken);
      pill.dataset.state = asking ? "asking" : state;
      document.getElementById("chip").textContent = asking ? "Needs your OK" : chip;
      const el = document.getElementById("text");
      el.textContent = spoken;
      el.title = spoken;
      if (state !== "listening") micTarget = 0;
    }

    /* ---------- The blob ----------
       One droplet of water. Its outline is a soft capsule pushed in and out, all the way round,
       by a few slow waves; the waves swell with your voice, and each burst of speech drops a
       ripple ring inside it. Everything is drawn with plain 2D canvas: no simulation. */

    const canvas = document.getElementById("water");
    const ctx = canvas.getContext("2d");
    const still = matchMedia("(prefers-reduced-motion: reduce)");
    const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const C = {};
    const TAU = Math.PI * 2;
    const POINTS = 144;            // samples round the outline
    const body = { a: 110, b: 32 }; // half-width (follows the content) and half-height
    let targetA = 110;
    const MAX_SWELL = 15;          // the edge never leaves the window (half-height 50)

    // The droplet hugs what it holds: a small bead for "Listening…", a long drop for a sentence.
    const content = document.querySelector(".content");
    new ResizeObserver(() => {
      targetA = Math.max(92, Math.min(250, content.offsetWidth / 2 + 30));
    }).observe(content);

    function readColors() {
      ["--ramp-1", "--ramp-3", "--silt", "--sage", "--amber-text"].forEach((n) => { C[n] = css(n); });
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(innerWidth * dpr);
      canvas.height = Math.round(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // A point s (0..1) round a capsule, with its outward normal; s walks the outline at even spacing.
    function capsulePoint(s, cx, cy, a, b) {
      const c = a - b, straight = 2 * c, arc = Math.PI * b, P = 2 * straight + 2 * arc;
      let d = s * P;
      if (d < straight) return [cx - c + d, cy - b, 0, -1];
      d -= straight;
      if (d < arc) { const th = -Math.PI / 2 + d / b; return [cx + c + b * Math.cos(th), cy + b * Math.sin(th), Math.cos(th), Math.sin(th)]; }
      d -= arc;
      if (d < straight) return [cx + c - d, cy + b, 0, 1];
      d -= straight;
      const th = Math.PI / 2 + d / b;
      return [cx - c + b * Math.cos(th), cy + b * Math.sin(th), Math.cos(th), Math.sin(th)];
    }

    // How far the outline is pushed at s: slow, uneven mass (k = 1, 2) plus lobes (k = 3, 5, 7).
    function swell(s, t, amp, splash) {
      const u = s * TAU;
      return 4.5 * Math.sin(u + t * 0.31) + 3.2 * Math.sin(2 * u - t * 0.47 + 1.3)
           + amp * (0.55 * Math.sin(3 * u + t * 1.1)
                  + 0.30 * Math.sin(5 * u - t * 1.7 + 2.0)
                  + 0.15 * Math.sin(7 * u + t * 2.6 + 4.1))
           + splash * Math.sin(9 * u - t * 6.0);
    }

    // Lobe size per state; the microphone drives it while listening.
    function lobeAmp(state, t) {
      if (state === "listening") return 2.5 + mic * 11;
      if (state === "thinking") return 4;
      if (state === "speaking") return 4.5 + 2.5 * Math.abs(Math.sin(t * 2.1) * Math.sin(t * 0.7));
      if (state === "asking") return 3.5;
      return 2;
    }

    function blobPath(t, amp, splash) {
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const pts = [];
      for (let i = 0; i < POINTS; i++) {
        const s = i / POINTS;
        const [x, y, nx, ny] = capsulePoint(s, cx, cy, body.a, body.b);
        const d = Math.max(-body.b / 3, Math.min(MAX_SWELL, swell(s, t, amp, splash)));
        pts.push([x + nx * d, y + ny * d]);
      }
      // Smooth curve through the midpoints, so the outline has no corners.
      const path = new Path2D();
      const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      let m = mid(pts[POINTS - 1], pts[0]);
      path.moveTo(m[0], m[1]);
      for (let i = 0; i < POINTS; i++) {
        const p = pts[i], n = mid(p, pts[(i + 1) % POINTS]);
        path.quadraticCurveTo(p[0], p[1], n[0], n[1]);
      }
      path.closePath();
      return path;
    }

    /* Ripple rings: dropped by bursts of your voice, or Jarvis's while it speaks. */
    const rings = [];
    let micSlow = 0, lastRing = -1, splash = 0;

    function dropRing(t, x, strength) {
      if (rings.length >= 6) rings.shift();
      rings.push({ x, born: t, strength });
      lastRing = t;
    }

    function ringsFor(state, t) {
      if (still.matches) { rings.length = 0; return; }
      const cx = innerWidth / 2;
      if (state === "listening") {
        // An onset: the level jumps above its slow average.
        if (mic > 0.16 && mic - micSlow > 0.07 && t - lastRing > 0.22) {
          dropRing(t, cx + (Math.random() * 2 - 1) * (body.a - body.b) * 0.8, Math.min(1, 0.4 + mic));
          splash = Math.min(4, splash + 1.5 + mic * 3);
        }
      } else if (state === "speaking") {
        if (t - lastRing > 0.95) dropRing(t, cx - body.a + 36, 0.55);
      }
      micSlow += (mic - micSlow) * 0.05;
    }

    function drawRings(t, tint) {
      const LIFE = 1.6;
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i], p = (t - r.born) / LIFE;
        if (p >= 1) { rings.splice(i, 1); continue; }
        const ease = 1 - Math.pow(1 - p, 3);
        ctx.beginPath();
        ctx.ellipse(r.x, innerHeight / 2, 8 + ease * 170, 4 + ease * 40, 0, 0, TAU);
        ctx.globalAlpha = r.strength * 0.45 * (1 - p) * (1 - p);
        ctx.lineWidth = 1.5 - p;
        ctx.strokeStyle = tint;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    let frozenAt = 0;  // reduced motion: a still droplet, but still a droplet

    function frame(ms) {
      const t = still.matches ? frozenAt : ms / 1000;
      const state = pill.dataset.state;
      mic += (micTarget - mic) * (micTarget > mic ? 0.45 : 0.12);
      splash *= 0.93;
      // Stretch out quickly so new words are never outside it; settle back slowly.
      body.a = still.matches ? targetA : body.a + (targetA - body.a) * (targetA > body.a ? 0.3 : 0.1);
      ringsFor(state, t);

      const W = innerWidth, H = innerHeight;
      ctx.clearRect(0, 0, W, H);
      const blob = blobPath(t, still.matches ? 2 : lobeAmp(state, t), still.matches ? 0 : splash);

      let tint = C["--silt"], strength = 0.10, speed = 0.06;
      if (state === "listening") strength = 0.10 + mic * 0.30;
      if (state === "thinking") { tint = C["--sage"]; strength = 0.16; speed = 0.22; }
      if (state === "speaking") strength = 0.18;
      if (state === "asking") { tint = C["--amber-text"]; strength = 0.14; }

      // Opaque water (XWayland lightens partial alpha); everything else is drawn inside it.
      ctx.fillStyle = C["--ramp-1"];
      ctx.fill(blob);
      ctx.save();
      ctx.clip(blob);
      // Depth: lighter where the droplet is thickest.
      const depth = ctx.createLinearGradient(0, H / 2 - body.b - 10, 0, H / 2 + body.b + 10);
      depth.addColorStop(0, C["--ramp-3"]);
      depth.addColorStop(0.55, C["--ramp-1"]);
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = depth;
      ctx.fillRect(0, 0, W, H);
      // A lit current drifts through it, tinted by state.
      const sweep = still.matches ? 0.5 : (t * speed) % 1;
      const gx = -W * 0.4 + sweep * W * 1.8;
      const g = ctx.createRadialGradient(gx, H / 2, 0, gx, H / 2, W * 0.5);
      g.addColorStop(0, tint);
      g.addColorStop(1, "transparent");
      ctx.globalAlpha = strength;
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      drawRings(t, tint);
      ctx.restore();

      // The skin: brighter as you speak louder.
      ctx.globalAlpha = state === "listening" ? 0.35 + mic * 0.55 : 0.4;
      ctx.lineWidth = 1.25;
      ctx.strokeStyle = state === "asking" ? C["--amber-text"] : state === "thinking" ? C["--sage"] : C["--silt"];
      ctx.stroke(blob);
      ctx.globalAlpha = 1;
      document.getElementById("orb").style.transform = `scale(${1 + mic * 0.6})`;
      requestAnimationFrame(frame);  // pauses on its own while the pill is hidden
    }

    readColors();
    resize();
    addEventListener("resize", resize);
    document.fonts?.ready.then(readColors);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
