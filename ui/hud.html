<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis voice pill</title>
  <link rel="stylesheet" href="css/overlay.css">
  <style>
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pill {
      width: min(504px, calc(100vw - 16px));
      height: 52px;
      border-radius: 26px;
      padding: 0 8px 0 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Four bars, cold water: they move while Jarvis is listening or speaking. */
    .wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 20px;
      flex: 0 0 auto;
    }

    .wave span {
      width: 3px;
      height: 6px;
      border-radius: 2px;
      background: var(--silt);
      transition: height 200ms var(--ease-out), background-color 200ms;
    }

    .pill[data-state="listening"] .wave span,
    .pill[data-state="speaking"] .wave span {
      animation: wave 1.1s ease-in-out infinite;
    }

    .wave span:nth-child(2) { animation-delay: 0.14s; background: var(--silt-deep); }
    .wave span:nth-child(3) { animation-delay: 0.28s; }
    .wave span:nth-child(4) { animation-delay: 0.42s; background: var(--sage); }

    .pill[data-state="thinking"] .wave span {
      background: var(--sage-deep);
      animation: overlay-pulse 1.4s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { height: 6px; }
      50% { height: 20px; }
    }

    .text {
      flex: 1 1 auto;
      min-width: 0;
      font-size: var(--t-body);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip {
      flex: 0 0 auto;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: var(--t-meta);
      font-weight: 700;
      color: var(--silt);
      background: rgba(127, 209, 217, 0.12);
    }

    .pill[data-state="thinking"] .chip { color: var(--sage); background: rgba(159, 191, 177, 0.12); }
    .pill[data-state="asking"] .chip { color: var(--amber-text); background: var(--amber-ground); }
  </style>
</head>
<body>
  <div class="pill overlay-surface" id="pill" data-state="listening">
    <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p class="text" id="text">Listening…</p>
    <span class="chip" id="chip">Listening</span>
  </div>

  <script>
    // Called from main.py's HUDWindow.update_hud_state(event, {text, spoken}).
    const STATES = {
      RECORDING_STARTED: ["listening", "Listening", () => "Listening…"],
      RECORDING_CLAUDE: ["listening", "Claude", () => "Listening… still talking to Claude (say “Jarvis” to switch back)"],
      STT_PREVIEW: ["thinking", "Heard", (d) => d.text || "Transcribing…"],
      AGENT_THINKING: ["thinking", "Thinking", (d) => d.text || "Working out what to do…"],
      TTS_SPEAKING: ["speaking", "Jarvis", (d) => d.spoken || d.text || ""],
      IDLE: ["idle", "Ready", () => "Hold your shortcut to talk"],
    };

    function updateHUDState(event, data) {
      const entry = STATES[event];
      if (!entry) return;
      data = data || {};
      const [state, chip, text] = entry;
      const spoken = text(data);
      // A spoken question that needs an answer ("I need your OK first…") gets the amber chip.
      const asking = event === "TTS_SPEAKING" && /need your OK/i.test(spoken);
      document.getElementById("pill").dataset.state = asking ? "asking" : state;
      document.getElementById("chip").textContent = asking ? "Needs your OK" : chip;
      const el = document.getElementById("text");
      el.textContent = spoken;
      el.title = spoken;
    }
  </script>
</body>
</html>
